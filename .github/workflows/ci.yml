name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Docs and CI checks
    runs-on: ubuntu-24.04
    outputs:
      app_changed: ${{ steps.paths.outputs.app_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Classify changed paths
        id: paths
        run: node scripts/ci-changes.mjs
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify change classification
        run: node --test scripts/ci-changes.test.mjs

      - name: Check changed docs and CI formatting
        env:
          FORMAT_FILES: ${{ steps.paths.outputs.format_files }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const files = JSON.parse(process.env.FORMAT_FILES);
          if (!files.length) process.exit(0);
          const config = JSON.parse(fs.readFileSync('.prettierrc', 'utf8'));
          // Markdown/YAML/CI scripts do not need the application's Tailwind plugin.
          delete config.plugins;
          const configPath = path.join(process.env.RUNNER_TEMP, 'prettier-docs.json');
          fs.writeFileSync(configPath, JSON.stringify(config));
          const result = spawnSync('npx', ['--yes', 'prettier@3.6.2', '--config', configPath, '--check', ...files], { stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          NODE

  lint-and-test:
    name: Lint, Type Check & Test
    needs: changes
    if: needs.changes.outputs.app_changed == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Discord invite link
        run: |
          DISCORD_URL="https://discord.gg/XuzjVXyjH4"
          echo "Checking Discord invite link: $DISCORD_URL"
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" -L "$DISCORD_URL")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Discord link is valid (HTTP $HTTP_STATUS)"
          else
            echo "❌ Discord link returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run Knip (unused code detection)
        run: npm run knip:production

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Generate coverage summary
        if: always()
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          npm run test:unit:coverage -- --reporter=verbose 2>&1 | grep -A 20 "% Coverage report" || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key-for-ci-build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  smoke-tests:
    name: Smoke Tests (UI Only)
    needs: changes
    if: needs.changes.outputs.app_changed == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key-for-ci-build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key-for-ci-build

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: playwright-report/
          retention-days: 7

  e2e-tests:
    name: E2E Tests (Shard ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.app_changed == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key-for-ci-build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests (shard ${{ matrix.shard }}/3)
        run: npx playwright test --project=e2e --shard=${{ matrix.shard }}/3
        env:
          CI: 'true'
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key-for-ci-build

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
